conformance:
- id: fix
  name: FIX (Financial Information eXchange) Protocol
  conforms: false
  status: unverified
  evidence: >-
    FIX is the dominant wire standard for electronic fixed income order and quote
    messaging, so it is the first domain standard worth probing for this sector.
    MultiLynq's own site never names FIX, FIXML or a FIX version, and no contract
    is published in which a FIX message type or session profile could be declared.
    Its venue partners (MarketAxess, Tradeweb, Trumid, LTX) do publish FIX
    interfaces, and MultiLynq's stated business is normalizing those venue
    protocols, but that is an inference about the upstream venues, not a
    conformance claim MultiLynq makes or that can be checked here.
