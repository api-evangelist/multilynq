aid: multilynq
name: MultiLynq
description: 'MultiLynq is a fixed income trading technology company founded in 2018
  by Patrick Scheideler and Scott Collins and based in Shrewsbury, New Jersey. It sells
  market integration as a service: a single high-performance API that normalizes the
  messaging and trading protocols of every major and emerging electronic U.S. fixed
  income trading venue — including MarketAxess, Tradeweb, Trumid, Bloomberg, ICE Bonds,
  LTX by Broadridge, Liquidnet, Octaura, TMC Bonds and Bonds.com — into one interface
  for credit, municipal bond and loan trading. The platform covers pre- and post-trade
  workflows including price dissemination, market data aggregation, RFQ negotiation,
  portfolio trading, auction mechanisms, quoting conventions, smart order routing,
  and post-trade reporting and reconciliation, delivered as a fully hosted solution
  in which clients establish a single physical connection to a MultiLynq data center
  while MultiLynq maintains all upstream venue connectivity. The company has raised
  funding from Citadel Securities and Jane Street. The API is the entire product, but
  it is sold and onboarded through a sales conversation: MultiLynq publishes no public
  developer portal, documentation, specification, SDK or pricing.'
